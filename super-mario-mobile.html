<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Wedding Dash</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=DM+Mono:wght@500&family=Pretendard:wght@500;700;800&display=swap');
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;background:#54b9ef;font-family:Pretendard,system-ui,sans-serif;touch-action:none}#game{display:block;width:100vw;height:100vh}.hud{position:fixed;z-index:4;top:max(12px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;justify-content:space-between;align-items:center;width:min(calc(100vw - 26px),900px);color:#fff;text-shadow:2px 3px #23598a;pointer-events:none}.logo{font:22px 'Black Han Sans';font-style:italic;letter-spacing:-1px}.logo b{color:#ffd258}.score{font:500 11px 'DM Mono',monospace;line-height:1.7;text-align:right}.boost{position:fixed;z-index:4;top:65px;left:50%;transform:translateX(-50%);width:min(170px,45vw);height:13px;border:3px solid #fff;border-radius:99px;background:#176eae99;overflow:hidden;pointer-events:none}.boost b{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd347,#ff825c);border-radius:99px}.notice{position:fixed;z-index:4;left:50%;transform:translateX(-50%);top:92px;background:#ffffffd9;color:#155486;border:3px solid #155486;border-radius:99px;padding:7px 13px;font-size:11px;font-weight:800;white-space:nowrap;pointer-events:none}.controls{position:fixed;z-index:5;bottom:max(18px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(calc(100vw - 32px),900px);display:flex;justify-content:space-between;align-items:end}.pad{display:flex;gap:12px}.btn{width:68px;height:68px;border:4px solid #fff;border-radius:50%;background:#1c72bcdd;color:#fff;box-shadow:0 6px 0 #124c7e;font:800 29px/1 Pretendard;touch-action:none}.btn.jump{width:84px;height:84px;background:#f16968;box-shadow:0 7px 0 #ab3e58}.btn.active,.btn:active{transform:translateY(5px);box-shadow:0 1px 0 #124c7e}.modal{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:22px;background:#0873c7bb;text-align:center;color:#fff}.modal.off{display:none}.card{width:min(100%,480px);padding:33px 24px 29px;background:#1b64b7;border:5px solid #fff;border-radius:28px;box-shadow:0 11px 0 #0e3d79,0 25px 60px #06294a99}.tag{font:500 11px 'DM Mono';letter-spacing:.14em;color:#ffe17a}.card h1{margin:12px 0;font:38px/1 'Black Han Sans';font-style:italic;letter-spacing:-2px}.card h1 b{color:#ffe055}.card p{font-size:16px;line-height:1.6;margin:9px}.go{margin-top:19px;border:4px solid #fff;border-radius:99px;padding:13px 20px;color:#16558e;background:#ffe05e;box-shadow:0 5px 0 #bc7a31;font:800 13px 'DM Mono';letter-spacing:.08em}.hint{font:500 10px 'DM Mono'!important;opacity:.8;margin-top:18px!important}@media(min-width:800px){.controls{opacity:.8}.btn{width:61px;height:61px}.btn.jump{width:74px;height:74px}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="hud"><div class="logo">WEDDING <b>DASH</b></div><div class="score">RINGS <span id="rings">00</span>/30<br>TIME <span id="time">00.0</span></div></div><div class="boost"><b id="boost"></b></div><div class="notice" id="notice">💍 RINGS 30개를 모아 WEDDING ARCH까지 DASH!</div>
<div class="controls"><div class="pad"><button class="btn" data-k="left">←</button><button class="btn" data-k="right">→</button></div><button class="btn jump" data-k="jump">↑</button></div>
<section class="modal" id="intro"><article class="card"><div class="tag">DD &amp; YOU · 2026.11.23</div><h1>WEDDING <b>DASH!</b></h1><p>꽃길을 전력 질주하며<br><b>골드 링 30개</b>를 모아 웨딩 아치에 도착하세요.</p><p>길게 달리면 <b>LOVE BOOST</b>가 차오릅니다!</p><button class="go" id="go">START DASH</button><p class="hint">MOBILE · 아래 버튼<br>DESKTOP · ← → / A D · SPACE</p></article></section>
<section class="modal off" id="finish"><article class="card"><div class="tag">MISSION COMPLETE</div><h1>JUST <b>MARRIED!</b></h1><p id="final"></p><p>2026.11.23 · 14:00<br>GRAND BALLROOM, 3F</p><button class="go" id="again">DASH AGAIN</button></article></section>
<script>
(()=>{const c=document.querySelector('#game'),g=c.getContext('2d'),$=s=>document.querySelector(s);let W,H,D,run=false,last=0,started=0,keys={left:false,right:false,jump:false},p,world,rings,particles,boost=0,finishX=5100,raf;
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();
function init(){p={x:110,y:H-172,vx:0,vy:0,w:38,h:48,on:true,spin:0};world={cam:0};boost=0;rings=[];for(let i=0;i<30;i++){let x=340+i*145+(i%4)*24,y=H-160-(i%5===0?100:i%7===0?170:0);rings.push({x,y,got:false})}particles=[];ui()}
function ui(){let n=rings.filter(r=>r.got).length;$('#rings').textContent=String(n).padStart(2,'0');$('#boost').style.width=boost+'%';$('#time').textContent=run?((performance.now()-started)/1000).toFixed(1):'00.0';$('#notice').style.opacity=p.x>400?0:1}
function set(k,v){keys[k]=v;document.querySelectorAll('[data-k="'+k+'"]').forEach(b=>b.classList.toggle('active',v))}document.querySelectorAll('.btn').forEach(b=>{let k=b.dataset.k;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture?.(e.pointerId);set(k,true)});['pointerup','pointercancel','pointerleave'].forEach(t=>b.addEventListener(t,e=>{e.preventDefault();set(k,false)}))});addEventListener('keydown',e=>{if(['ArrowLeft','KeyA'].includes(e.code))set('left',true);if(['ArrowRight','KeyD'].includes(e.code))set('right',true);if(['ArrowUp','KeyW','Space'].includes(e.code)){e.preventDefault();set('jump',true)}});addEventListener('keyup',e=>{if(['ArrowLeft','KeyA'].includes(e.code))set('left',false);if(['ArrowRight','KeyD'].includes(e.code))set('right',false);if(['ArrowUp','KeyW','Space'].includes(e.code))set('jump',false)});
function begin(){init();$('#intro').classList.add('off');$('#finish').classList.add('off');run=true;started=performance.now();last=started;raf=requestAnimationFrame(loop)}$('#go').onclick=begin;$('#again').onclick=begin;
function burst(x,y,col='#ffe05e',n=14){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*280,vy:(Math.random()-.7)*260,l:1,s:2+Math.random()*4,c:col})}
function ground(x){let a=H-105;return a-Math.sin(x*.008)*36-Math.sin(x*.021)*17-(x>1350&&x<1810?80*Math.sin((x-1350)/460*Math.PI):0)-(x>2800&&x<3300?65*Math.sin((x-2800)/500*Math.PI):0)}
function update(dt){let max=keys.right?(boost>65?530:360):keys.left?-190:0;p.vx+=(max-p.vx)*Math.min(1,dt*6);if(keys.right)boost=Math.min(100,boost+dt*12);else boost=Math.max(0,boost-dt*15);if(keys.jump&&p.on){p.vy=-575;p.on=false;keys.jump=false;burst(p.x,p.y+30,'#f7cad2',8)}p.vy+=1400*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;let gy=ground(p.x+p.w/2);if(p.y+p.h>=gy&&p.vy>=0){p.y=gy-p.h;p.vy=0;p.on=true}if(p.y>H+100){p.x=Math.max(80,p.x-180);p.y=ground(p.x)-p.h;p.vy=0}world.cam+=(p.x-W*.35-world.cam)*Math.min(1,dt*4);world.cam=Math.max(0,world.cam);rings.forEach(r=>{if(!r.got&&Math.hypot((p.x+p.w/2)-r.x,(p.y+p.h/2)-r.y)<34){r.got=true;boost=Math.min(100,boost+8);burst(r.x,r.y);navigator.vibrate?.(10)}});particles=particles.filter(q=>(q.l-=dt)>0);particles.forEach(q=>{q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=420*dt});if(p.x>finishX){run=false;let n=rings.filter(r=>r.got).length;$('#final').textContent=`${((performance.now()-started)/1000).toFixed(1)}초 만에 링 ${n}개를 모아 아치에 도착했어요!`;$('#finish').classList.remove('off')}ui()}
function poly(points,col){g.fillStyle=col;g.beginPath();points.forEach((v,i)=>i?g.lineTo(...v):g.moveTo(...v));g.closePath();g.fill()}
function draw(){let sky=g.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#55c9f6');sky.addColorStop(.62,'#92e1ef');sky.addColorStop(.63,'#e7d68e');sky.addColorStop(1,'#65bd65');g.fillStyle=sky;g.fillRect(0,0,W,H);let cam=world.cam;for(let i=-1;i<9;i++){let x=i*220-(cam*.16%220);g.fillStyle='#fff';g.beginPath();g.ellipse(x+80,110+(i%3)*35,58,18,0,0,7);g.ellipse(x+115,98+(i%3)*35,41,23,0,0,7);g.fill()}for(let i=-1;i<10;i++){let x=i*230-(cam*.32%230);poly([[x,H-110],[x+110,H-280],[x+235,H-110]],'#58a86c')}g.save();g.translate(-cam,0);g.fillStyle='#86c95e';g.beginPath();g.moveTo(cam-40,H);for(let x=cam-40;x<cam+W+60;x+=10)g.lineTo(x,ground(x));g.lineTo(cam+W+60,H);g.closePath();g.fill();g.strokeStyle='#eddf8d';g.lineWidth=7;g.beginPath();for(let x=cam-40;x<cam+W+60;x+=9){let y=ground(x);x===cam-40?g.moveTo(x,y):g.lineTo(x,y)}g.stroke();for(let i=0;i<100;i++){let x=Math.floor((cam-30)/55+i)*55+12,y=ground(x)+4;g.fillStyle=i%2?'#ef7790':'#fff0a0';g.beginPath();g.arc(x,y,5,0,7);g.fill()}rings.forEach(r=>{if(r.got)return;g.save();g.translate(r.x,r.y);g.rotate(performance.now()/250);g.strokeStyle='#ffd545';g.lineWidth=7;g.shadowColor='#fff0a6';g.shadowBlur=12;g.beginPath();g.arc(0,0,13,0,7);g.stroke();g.restore()});let ax=finishX;g.strokeStyle='#fff4cf';g.shadowColor='#fbcf64';g.shadowBlur=18;g.lineWidth=12;g.beginPath();g.arc(ax,ground(ax)-110,88,Math.PI,0);g.stroke();g.beginPath();g.moveTo(ax-88,ground(ax)-110);g.lineTo(ax-88,ground(ax));g.moveTo(ax+88,ground(ax)-110);g.lineTo(ax+88,ground(ax));g.stroke();g.shadowBlur=0;g.fillStyle='#f15f78';g.fillRect(ax-75,ground(ax)-80,150,36);g.fillStyle='#fff';g.font='800 15px Pretendard';g.textAlign='center';g.fillText('WEDDING ARCH',ax,ground(ax)-56);particles.forEach(q=>{g.globalAlpha=q.l;g.fillStyle=q.c;g.beginPath();g.arc(q.x,q.y,q.s,0,7);g.fill()});g.globalAlpha=1;g.save();g.translate(p.x+p.w/2,p.y+p.h/2);g.rotate(Math.min(.6,Math.max(-.6,p.vx/600)));if(Math.abs(p.vx)>420){g.fillStyle='#f4c9cc';for(let i=0;i<3;i++)g.fillRect(-52-i*14,-6,30,5)}g.fillStyle='#172f69';g.beginPath();g.arc(0,-7,20,0,7);g.fill();g.fillStyle='#fff';g.beginPath();g.arc(0,-12,12,0,7);g.fill();g.fillStyle='#16275d';g.fillRect(-17,9,34,22);g.fillStyle='#f06274';g.fillRect(-17,27,34,6);g.fillStyle='#f3cf68';g.beginPath();g.arc(0,17,4,0,7);g.fill();g.restore();g.restore();g.font='italic 800 20px Pretendard';g.fillStyle='#ffffffd9';g.textAlign='center';g.fillText('RUN FOR LOVE!',W/2,H-145)}
function loop(t){if(!run)return;let dt=Math.min(.03,(t-last)/1000);last=t;update(dt);draw();raf=requestAnimationFrame(loop)}init();draw()})();
</script>
</body></html>
