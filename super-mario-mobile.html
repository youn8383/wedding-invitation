<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wedding Dash</title>
<style>
:root{--ink:#201b35;--cream:#fff8e8;--pink:#ff6f91;--red:#ee4d6d;--gold:#ffd166;--mint:#a7f3d0}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#18152b;color:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}body{display:grid;place-items:center;padding:16px}.game{width:min(100%,460px);overflow:hidden;border:4px solid #0d0b19;border-radius:20px;background:var(--cream);box-shadow:0 12px 0 #0d0b19}.screen{position:relative;min-height:760px;overflow:hidden;background:linear-gradient(#8ed8ff 0 53%,#b7edaa 53% 72%,#4fbd74 72%);touch-action:manipulation}.sun{position:absolute;top:42px;right:42px;width:72px;height:72px;background:#ffe89a;box-shadow:0 0 0 8px #fff0b8}.cloud{position:absolute;background:#fff;border:4px solid #4d74a8;width:104px;height:28px;top:100px;left:24px;box-shadow:24px -16px 0 -4px #fff,55px 4px 0 -3px #fff}.cloud.two{top:190px;left:auto;right:-26px;transform:scale(.8)}.hud{position:relative;z-index:3;display:flex;justify-content:space-between;padding:18px 20px;color:#fff;background:#292044;border-bottom:4px solid #0d0b19;font-size:12px}.hud b{color:var(--gold)}.title{position:relative;z-index:2;text-align:center;padding:36px 20px 0;text-shadow:3px 3px 0 #fff;font-size:clamp(26px,8vw,42px);color:var(--red);letter-spacing:2px}.subtitle{text-align:center;position:relative;z-index:2;margin-top:8px;font-size:12px}.track{position:absolute;left:0;right:0;bottom:178px;height:8px;background:#292044;box-shadow:0 12px 0 #fff,0 20px 0 #292044}.runner{position:absolute;z-index:4;left:19%;bottom:190px;width:42px;height:58px;animation:run .42s steps(2) infinite;filter:drop-shadow(5px 5px 0 #292044)}.runner:before{content:'💍';position:absolute;top:-28px;left:2px;font-size:24px}.head{position:absolute;top:0;left:11px;width:24px;height:24px;background:#ffd0ae;border:4px solid #292044}.body{position:absolute;top:22px;left:7px;width:32px;height:24px;background:var(--pink);border:4px solid #292044}.leg{position:absolute;top:43px;width:10px;height:18px;background:#292044}.leg.a{left:8px}.leg.b{left:25px}.obstacle{position:absolute;z-index:3;bottom:190px;right:18%;font-size:38px;animation:move 4s linear infinite}.heart{position:absolute;z-index:2;font-size:30px;animation:float 2.4s ease-in-out infinite}.heart.one{left:10%;top:290px}.heart.two{right:12%;top:360px;animation-delay:1s}.card{position:absolute;z-index:5;left:6%;right:6%;bottom:26px;padding:24px 20px 20px;text-align:center;background:#fff;border:4px solid #292044;box-shadow:8px 8px 0 #292044}.card h2{margin:0 0 12px;color:var(--red);font-size:21px}.card p{margin:8px 0;font-size:13px;line-height:1.8}.date{display:inline-block;margin:10px 0;padding:8px 12px;background:var(--gold);border:3px solid #292044;font-weight:700}.cta{display:inline-block;margin-top:8px;padding:12px 18px;background:var(--mint);border:3px solid #292044;color:var(--ink);font-weight:700;cursor:pointer;touch-action:manipulation}.hint{margin-top:12px;font-size:10px;color:#625b76}.toast{position:fixed;z-index:20;transform:translate(-50%,-50%);pointer-events:none;color:var(--red);font-size:24px;animation:pop 900ms ease-out forwards}@keyframes run{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-7px) rotate(2deg)}}@keyframes move{from{right:-12%}to{right:115%}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}@keyframes pop{0%{opacity:1;transform:translate(-50%,-50%) scale(.7)}100%{opacity:0;transform:translate(-50%,-130%) scale(1.5)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important}}button{font:inherit}
</style>
</head>
<body>
<main class="game" aria-label="Wedding Dash 모바일 청첩장">
<section class="screen" id="screen">
<div class="sun"></div><div class="cloud"></div><div class="cloud two"></div>
<header class="hud"><span>WEDDING DASH</span><span>SCORE <b id="score">0</b></span></header>
<h1 class="title">우리의 결혼 퀘스트</h1><p class="subtitle">두근두근, 사랑을 향해 함께 달려요!</p>
<div class="heart one">♥</div><div class="heart two">♥</div><div class="track"></div><div class="runner" aria-hidden="true"><i class="head"></i><i class="body"></i><i class="leg a"></i><i class="leg b"></i></div><div class="obstacle" aria-hidden="true">💌</div>
<article class="card"><h2>DD &amp; Partner</h2><p>저희 두 사람이 새로운 스테이지를 시작합니다.<br>소중한 분들과 함께 축하하고 싶어요.</p><div class="date">2026. 00. 00 · 00:00</div><p>아름다운 날, 귀한 걸음으로 함께해 주세요.</p><button type="button" class="cta" id="cta">START LOVE ♥</button><div class="hint">화면을 터치하면 사랑의 점수가 올라갑니다</div></article>
</section></main>
<script>
(()=>{
 const screen=document.getElementById('screen'), scoreEl=document.getElementById('score'), cta=document.getElementById('cta'); let score=0;
 function pop(x,y){const h=document.createElement('span');h.className='toast';h.textContent='♥';h.style.left=x+'px';h.style.top=y+'px';document.body.appendChild(h);setTimeout(()=>h.remove(),900)}
 function addScore(x,y){score++;scoreEl.textContent=score;pop(x,y)}
 screen.addEventListener('pointerup',e=>{if(e.target.closest('#cta'))return;addScore(e.clientX,e.clientY)},{passive:true});
 cta.addEventListener('pointerup',e=>{e.preventDefault();score+=10;scoreEl.textContent=score;cta.textContent='초대장을 확인했어요 ♥';pop(e.clientX,e.clientY)},{passive:false});
})();
</script>
</body>
</html>
