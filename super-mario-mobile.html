<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Afterglow — Wedding Run</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Pretendard:wght@400;600;700&display=swap');
:root{--ink:#10172d;--night:#141b34;--cream:#fbf7ee;--gold:#d9ae62;--rose:#d68391;--glass:rgba(255,255,255,.11)}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;background:var(--night);font-family:Pretendard,system-ui,sans-serif;touch-action:none;color:var(--cream)}#wrap{height:100%;display:grid;place-items:center;background:radial-gradient(circle at 70% 8%,#444267 0,#1a203c 35%,#0d1225 100%)}canvas{width:min(100vw,600px);height:min(100vh,880px);display:block;background:#10172d;box-shadow:0 28px 90px #0008}.top{position:fixed;top:max(16px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:min(calc(100vw - 30px),570px);z-index:4;display:flex;justify-content:space-between;align-items:center;pointer-events:none}.brand{font:500 13px 'DM Mono',monospace;letter-spacing:.12em;color:#fff;text-shadow:0 2px 8px #000}.brand em{color:#e6c379;font-style:normal}.meter{height:9px;width:112px;border-radius:20px;border:1px solid #ffffff75;background:#ffffff1d;overflow:hidden}.meter b{display:block;width:0;height:100%;background:linear-gradient(90deg,#e8c77f,#e687a2);border-radius:20px}.stats{position:fixed;left:50%;bottom:max(112px,calc(env(safe-area-inset-bottom) + 100px));transform:translateX(-50%);z-index:4;width:min(calc(100vw - 30px),570px);display:flex;justify-content:space-between;pointer-events:none}.chip{backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);background:var(--glass);border:1px solid #ffffff35;border-radius:99px;padding:9px 12px;font:500 11px 'DM Mono',monospace;letter-spacing:.04em;color:#fff}.control{position:fixed;z-index:5;bottom:max(20px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(calc(100vw - 34px),570px);display:flex;justify-content:space-between;align-items:end}.pad{display:flex;gap:12px}.btn{border:1px solid #ffffff50;background:#ffffff18;color:#fff;width:66px;height:66px;border-radius:50%;font:600 21px/1 Pretendard;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:inset 0 1px #fff4,0 10px 25px #0003;touch-action:none}.btn.jump{width:78px;height:78px;background:linear-gradient(140deg,#e3bd6f,#bd687d);border:0;font-size:25px;box-shadow:0 10px 24px #0005}.btn.active,.btn:active{transform:scale(.93);filter:brightness(1.2)}.modal{position:fixed;z-index:10;inset:0;display:grid;place-items:center;padding:24px;background:linear-gradient(#0b1026a6,#0b1026db);text-align:center}.modal.off{display:none}.card{width:min(100%,440px);padding:36px 28px 30px;border:1px solid #ffffff4d;border-radius:28px;background:linear-gradient(135deg,#ffffff1d,#ffffff0a);box-shadow:0 24px 60px #0007;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}.eyebrow{font:500 10px 'DM Mono',monospace;color:#e5c77f;letter-spacing:.19em}.card h1{margin:15px 0 13px;font:500 39px/1.08 'Playfair Display',serif;letter-spacing:-.045em}.card h1 i{font-weight:500;color:#e8c77d}.card p{margin:8px 0;color:#ece9e1cc;font-size:15px;line-height:1.65}.go{margin-top:23px;border:0;border-radius:100px;padding:14px 23px;color:#222033;background:#f3dfaa;font:600 12px 'DM Mono',monospace;letter-spacing:.1em;box-shadow:0 8px 25px #0004}.hint{font:400 10px 'DM Mono',monospace!important;line-height:1.7!important;color:#ffffff90!important;margin-top:20px!important}@media(min-width:700px){.control{opacity:.75}.btn{width:60px;height:60px}.btn.jump{width:70px;height:70px}}
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<header class="top"><div class="brand">AFTER<em>GLOW</em> / 01</div><div class="meter"><b id="meter"></b></div></header>
<div class="stats"><span class="chip">RINGS <b id="rings">00</b> / 15</span><span class="chip">SCORE <b id="score">0000</b></span></div>
<div class="control"><div class="pad"><button class="btn" data-k="left">←</button><button class="btn" data-k="right">→</button></div><button class="btn jump" data-k="jump">↑</button></div>
<section class="modal" id="intro"><article class="card"><div class="eyebrow">DD &amp; YOU · 2026.11.23</div><h1>Run toward<br><i>the afterglow.</i></h1><p>반짝이는 조각들을 모아<br>우리의 웨딩 아치에 도착해 주세요.</p><button class="go" id="go">BEGIN THE RUN</button><p class="hint">MOBILE · 하단 버튼<br>DESKTOP · ← → / A D · SPACE</p></article></section>
<section class="modal off" id="finish"><article class="card"><div class="eyebrow">YOU MADE IT</div><h1>Our story<br><i>begins here.</i></h1><p id="summary"></p><p>2026.11.23 · 14:00<br>GRAND BALLROOM, 3F</p><button class="go" id="again">RUN AGAIN</button></article></section>
<script>
(()=>{const cv=document.querySelector('#game'),g=cv.getContext('2d'),intro=document.querySelector('#intro'),finish=document.querySelector('#finish'),$=s=>document.querySelector(s);let W,H,D,playing=false,last=0,raf,keys={left:false,right:false,jump:false},p,rings,particles,petals,goal,score,cam;
function resize(){D=Math.min(devicePixelRatio||1,2);W=Math.min(innerWidth,600);H=Math.min(innerHeight,880);cv.width=W*D;cv.height=H*D;g.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();
function init(){p={x:W*.5,y:H-115,vx:0,vy:0,r:16,on:true,tilt:0};score=0;cam=0;goal={y:-2360};rings=[];for(let i=0;i<15;i++)rings.push({x:90+(i*97)%Math.max(160,W-180),y:H-270-i*150,got:false,spin:i});particles=[];petals=Array.from({length:42},(_,i)=>({x:Math.random()*W,y:Math.random()*H,s:2+Math.random()*4,v:.35+Math.random(),a:Math.random()*6.3,c:i%3}));ui()}
function ui(){$('#rings').textContent=String(rings.filter(o=>o.got).length).padStart(2,'0');$('#score').textContent=String(score).padStart(4,'0');$('#meter').style.width=Math.min(100,Math.max(0,cam/2400*100))+'%'}
function input(k,on){keys[k]=on;document.querySelectorAll('[data-k="'+k+'"]').forEach(b=>b.classList.toggle('active',on))}document.querySelectorAll('.btn').forEach(b=>{let k=b.dataset.k;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture?.(e.pointerId);input(k,true)});['pointerup','pointercancel','pointerleave'].forEach(t=>b.addEventListener(t,e=>{e.preventDefault();input(k,false)}))});addEventListener('keydown',e=>{if(['ArrowLeft','KeyA'].includes(e.code))input('left',true);if(['ArrowRight','KeyD'].includes(e.code))input('right',true);if(['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault();input('jump',true)}});addEventListener('keyup',e=>{if(['ArrowLeft','KeyA'].includes(e.code))input('left',false);if(['ArrowRight','KeyD'].includes(e.code))input('right',false);if(['Space','ArrowUp','KeyW'].includes(e.code))input('jump',false)});
function begin(){init();intro.classList.add('off');finish.classList.add('off');playing=true;last=performance.now();raf=requestAnimationFrame(loop)}$('#go').onclick=begin;$('#again').onclick=begin;
function burst(x,y,col='#eac87f'){for(let i=0;i<18;i++)particles.push({x,y,vx:(Math.random()-.5)*180,vy:(Math.random()-.7)*180,l:1,s:2+Math.random()*3,c:col})}
function update(dt){petals.forEach(q=>{q.y+=q.v*35*dt;q.x+=Math.sin(q.y*.015)*12*dt;if(q.y>H+10){q.y=-10;q.x=Math.random()*W}});p.vx=(keys.left?-1:keys.right?1:0)*250;p.x+=p.vx*dt;p.x=Math.max(26,Math.min(W-26,p.x));p.tilt+=(p.vx/250-p.tilt)*.13;if(keys.jump&&p.on){p.vy=-440;p.on=false;keys.jump=false;burst(p.x,p.y+16,'#f1dcc2')}p.vy+=1050*dt;p.y+=p.vy*dt;if(p.y>H-115){p.y=H-115;p.vy=0;p.on=true}if(p.y<H*.42&&p.vy<0){let d=(H*.42-p.y);p.y=H*.42;cam+=d;for(const o of rings)o.y+=d;goal.y+=d}for(const o of rings)if(!o.got&&Math.hypot(p.x-o.x,p.y-o.y)<34){o.got=true;score+=100;burst(o.x,o.y);navigator.vibrate?.(12)}particles=particles.filter(q=>(q.l-=dt)>0);particles.forEach(q=>{q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=220*dt});if(goal.y>H-230){playing=false;$('#summary').textContent=`빛나는 조각 ${rings.filter(o=>o.got).length}개와 함께, ${score.toLocaleString()}점을 기록했어요.`;finish.classList.remove('off')}ui()}
function line(x1,y1,x2,y2,c,w=1){g.strokeStyle=c;g.lineWidth=w;g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke()}
function draw(){let bg=g.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#151b38');bg.addColorStop(.55,'#293150');bg.addColorStop(1,'#d9a7a1');g.fillStyle=bg;g.fillRect(0,0,W,H);let glow=g.createRadialGradient(W*.5,H*.68,5,W*.5,H*.68,W*.7);glow.addColorStop(0,'#f8dea366');glow.addColorStop(1,'#f8dea300');g.fillStyle=glow;g.fillRect(0,0,W,H);petals.forEach(q=>{g.fillStyle=['#f2cbd1','#ead39c','#ffffff'][q.c];g.globalAlpha=.55;g.beginPath();g.ellipse(q.x,q.y,q.s,q.s*.55,q.y*.02,0,6.3);g.fill()});g.globalAlpha=1;g.strokeStyle='#f5dfb866';g.lineWidth=1;for(let y=H+80;y>-90;y-=110){g.beginPath();g.arc(W/2,y,Math.max(40,(H-y)*.38),Math.PI*.12,Math.PI*.88);g.stroke()}g.fillStyle='#0b1025a6';g.beginPath();g.moveTo(0,H);g.lineTo(W*.18,H*.72);g.lineTo(W*.48,H*.82);g.lineTo(W*.77,H*.63);g.lineTo(W,H*.76);g.lineTo(W,H);g.fill();rings.forEach(o=>{if(o.got)return;g.save();g.translate(o.x,o.y);g.rotate(performance.now()/600+o.spin);g.strokeStyle='#f5d78e';g.lineWidth=5;g.shadowColor='#ffe4a5';g.shadowBlur=14;g.beginPath();g.arc(0,0,11,0,6.28);g.stroke();g.restore()});g.save();g.translate(W/2,goal.y);g.strokeStyle='#f6dfb7';g.lineWidth=3;g.shadowColor='#f8d789';g.shadowBlur=16;g.beginPath();g.arc(0,42,68,Math.PI,0);g.stroke();line(-68,42,-68,118,'#f6dfb7',3);line(68,42,68,118,'#f6dfb7',3);g.fillStyle='#f7e4bf22';g.fillRect(-65,44,130,74);g.font='13px DM Mono';g.fillStyle='#f9e9c9';g.textAlign='center';g.fillText('FOREVER',0,84);g.restore();particles.forEach(q=>{g.globalAlpha=q.l;g.fillStyle=q.c;g.beginPath();g.arc(q.x,q.y,q.s,0,6.28);g.fill()});g.globalAlpha=1;g.save();g.translate(p.x,p.y);g.rotate(p.tilt*.18);g.fillStyle='#f7f0e4';g.beginPath();g.arc(0,-8,13,0,6.28);g.fill();g.fillStyle='#171b2d';g.fillRect(-11,5,22,24);g.fillStyle='#d88998';g.fillRect(-11,22,22,4);g.fillStyle='#efe4cb';g.fillRect(-5,6,10,12);g.fillStyle='#d8ae61';g.beginPath();g.arc(0,12,3,0,6.28);g.fill();g.restore();g.font='italic 16px Playfair Display';g.fillStyle='#fff8edc9';g.textAlign='center';g.fillText('follow the glow',W/2,H-35)}
function loop(t){if(!playing)return;let dt=Math.min(.032,(t-last)/1000);last=t;update(dt);draw();raf=requestAnimationFrame(loop)}init();draw()})();
</script>
</body>
</html>
