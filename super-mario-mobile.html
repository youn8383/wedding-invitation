<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wedding Dash</title>
<style>
:root{--ink:#17142b;--panel:#292044;--cream:#fff8e8;--pink:#ee4d6d;--gold:#ffd166;--mint:#a7f3d0}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#141124;color:var(--cream);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}body{display:grid;place-items:center;padding:12px}.wrap{width:min(100%,760px);text-align:center}.hud{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--panel);border:4px solid var(--ink);border-bottom:0;font-size:clamp(11px,2.5vw,16px)}.hud b{color:var(--gold)}.stage{position:relative;width:100%;aspect-ratio:16/9;background:#80d6f5;border:4px solid var(--ink);image-rendering:pixelated;image-rendering:crisp-edges}.stage canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}.help{margin-top:10px;color:#bdb6d3;font-size:11px}.controls{display:flex;justify-content:center;gap:10px;margin-top:10px}.controls button{width:58px;height:42px;border:3px solid var(--ink);background:var(--gold);font:bold 18px monospace;touch-action:none}.controls button:active{transform:translateY(2px);background:var(--pink)}.again{display:none;margin-top:10px;padding:10px 18px;border:3px solid var(--ink);background:var(--mint);font:bold 13px monospace}.again.show{display:inline-block}
</style>
</head>
<body><main class="wrap"><header class="hud"><span>WEDDING DASH</span><span>RINGS <b id="rings">0</b>/30 · <b id="status">RUN!</b></span></header><div class="stage"><canvas id="game" width="320" height="180" aria-label="링 30개를 모아 신부를 만나 웨딩 클리어하는 픽셀 게임"></canvas></div><div class="controls"><button data-key="left" aria-label="왼쪽">◀</button><button data-key="jump" aria-label="점프">▲</button><button data-key="right" aria-label="오른쪽">▶</button><button data-key="boost" aria-label="부스트">★</button></div><button id="again" class="again">다시 보기</button><p class="help">← → 이동 · ↑ 점프 · Shift 부스트 · 링 30개를 모아 신부를 만나세요</p></main>
<script>
(()=>{
const c=document.getElementById('game'),x=c.getContext('2d'),W=320,H=180,ringsEl=document.getElementById('rings'),statusEl=document.getElementById('status'),again=document.getElementById('again');x.imageSmoothingEnabled=false;
const keys={left:false,right:false,jump:false,boost:false};let player,bride, camera,collected,win,phase,flash=0,confetti=[];const world=1120,archX=1045;
const ringX=[70,95,120,170,205,240,275,320,350,380,420,455,490,525,560,600,635,670,705,740,775,810,845,875,900,925,950,975,1000,1030];let rings=[];const sparks=Array.from({length:24},(_,i)=>({x:(i*47)%320,y:20+(i*23)%70,p:i%4}));
function reset(){rings=ringX.map((v,i)=>({x:v,y:92+(i%3)*9,taken:false}));player={x:22,y:128,vy:0,on:true,state:'run',frame:0,anim:0,boost:0,land:0};bride={x:1065,y:128,target:1065,run:false,frame:0};camera=0;collected=0;win=false;phase='play';flash=0;confetti=[];ringsEl.textContent='0';statusEl.textContent='RUN!';again.classList.remove('show')}
function rect(px,py,w,h,color){x.fillStyle=color;x.fillRect(Math.round(px-camera),Math.round(py),w,h)}function text(t,px,py,size=8,color='#201b35'){x.fillStyle=color;x.font=`${size}px monospace`;x.fillText(t,px,py)}
function bg(){x.fillStyle='#83d8f6';x.fillRect(0,0,W,H);rect(260,14,22,22,'#ffe89a');for(const s of sparks){const sx=(s.x-camera*.18+4000)%320;if((s.p+Math.floor(performance.now()/350))%4===0)rect(sx,s.y,2,2,'#fff8c7')}for(let i=-1;i<7;i++){const cx=i*70-(camera*.12%70);rect(cx,44,26,5,'#fff');rect(cx+8,40,20,5,'#fff');rect(cx+18,47,20,4,'#fff')}x.fillStyle='#9ee39b';x.fillRect(0,105,W,35);x.fillStyle='#58be76';x.fillRect(0,140,W,40);for(let i=0;i<18;i++){const fx=(i*31-camera*.75)%320;rect(fx,137-(i%3)*2,2,3,i%2?'#ee6d91':'#ffd166');rect(fx+3,138-(i%3)*2,2,2,'#fff8e8')}for(let i=0;i<9;i++){const rx=i*48-(camera*.5%48);rect(rx,152,20,2,'#3b9b62')}}
function drawRing(r){if(r.taken)return;const sx=r.x-camera,p=Math.floor(performance.now()/180)%2;x.strokeStyle='#ffd166';x.lineWidth=3;x.beginPath();x.arc(Math.round(sx),r.y,5+p,0,Math.PI*2);x.stroke();rect(sx-1,r.y-8,2,2,'#fff8c7')}
function drawArch(){const sx=archX-camera;rect(sx,72,5,68,'#ee4d6d');rect(sx+42,72,5,68,'#ee4d6d');rect(sx+5,67,32,5,'#ee4d6d');rect(sx+8,62,26,5,'#ffd166');rect(sx+14,55,14,7,'#a7f3d0');rect(sx+8,76,34,15,'#fff8e8');text('♥',sx+16,87,9,'#ee4d6d')}
function groom(px,py){const f=player.frame,bob=player.on?Math.sin(performance.now()/(player.boost?65:130))*1.5:0;py+=bob;rect(px-4,py-25,8,8,'#ffd0ae');rect(px-5,py-28,10,4,'#17142b');rect(px-7,py-17,14,14,'#1b2f55');rect(px-3,py-16,6,9,'#fff8e8');const arm=f%2?4:-4;rect(px-10,py-15+arm,4,10,'#1b2f55');rect(px+6,py-15-arm,4,10,'#1b2f55');const a=f%2?4:0,b=f%2?0:4;rect(px-6+a,py-3,5,11,'#17142b');rect(px+1+b,py-3,5,11,'#17142b');rect(px-7+a,py+7,6,3,'#10101c');rect(px+1+b,py+7,6,3,'#10101c');if(player.state==='jump'){rect(px-11,py-8,4,3,'#1b2f55');rect(px+7,py-8,4,3,'#1b2f55')}if(player.state==='boost'){rect(px-14,py-10,5,3,'#ffd166');rect(px-18,py-7,4,2,'#ee4d6d')}}
function brideDraw(){const bob=Math.sin(performance.now()/280)*1,px=bride.x-camera,py=bride.y+bob;rect(px-5,py-25,10,9,'#ffd0ae');rect(px-6,py-27,12,4,'#4a2637');rect(px-8,py-16,16,18,'#fff8e8');rect(px-11,py-10,5,3,'#ee4d6d');const wave=Math.floor(performance.now()/180)%2;rect(px+7,py-14-wave*3,7,3,'#ffd0ae');rect(px-7,py+2,14,4,'#ee4d6d')}
function confettiBurst(){confetti=Array.from({length:80},(_,i)=>({x:player.x+(i%5-2)*4,y:105-(i%8)*3,vx:(i%9-4)*.55,vy:-2-(i%6)*.35,c:['#ee4d6d','#ffd166','#a7f3d0','#fff8e8'][i%4],r:i%2?2:3}))}
function startMeet(){phase='meet';statusEl.textContent='MEET!';bride.run=true;bride.target=player.x+8;flash=8}
function updateMeet(){if(bride.x>bride.target)bride.x=Math.max(bride.target,bride.x-2.2);bride.frame=(bride.frame+1)%6;if(Math.abs(bride.x-player.x)<10){phase='clear';win=true;statusEl.textContent='CLEAR!';confettiBurst();flash=18}}
function input(){if(phase!=='play')return;let speed=player.boost?2.6:1.25;if(keys.left)player.x-=speed;if(keys.right||(!keys.left&&!keys.right))player.x+=speed*(player.boost?1.2:.45);player.x=Math.max(10,Math.min(world-45,player.x));if(keys.jump&&player.on){player.vy=-5.4;player.on=false;player.state='jump'}if(!player.on){player.vy+=.28;player.y+=player.vy;if(player.y>=128){player.y=128;player.vy=0;player.on=true;player.land=8;player.state='land'}}if(player.land>0){player.land--;if(player.land===0)player.state='run'}else if(player.on)player.state=player.boost?'boost':'run';player.boost=keys.boost?1:0;player.anim++;if(player.anim%Math.max(2,Math.floor(player.boost?3:7))===0)player.frame=(player.frame+1)%6;camera=Math.max(0,Math.min(world-W,player.x-70));for(const r of rings)if(!r.taken&&Math.hypot(player.x-r.x,player.y-r.y)<12){r.taken=true;collected++;ringsEl.textContent=collected}if(player.x>1020&&collected>=30)startMeet()}
function loop(){input();if(phase==='meet')updateMeet();if(phase==='clear'){for(const q of confetti){q.x+=q.vx;q.y+=q.vy;q.vy+=.08}if(flash>0)flash--}bg();for(const r of rings)drawRing(r);drawArch();groom(player.x,player.y);brideDraw();if(phase==='meet')text('신부가 달려옵니다 ♥',116,34,8,'#ee4d6d');if(phase==='clear'){x.fillStyle='rgba(255,255,255,.18)';x.fillRect(0,0,W,H);for(const q of confetti)rect(q.x,q.y,q.r,q.r,q.c);x.fillStyle='rgba(32,27,53,.88)';x.fillRect(35,52,250,76);text('WEDDING CLEAR!',74,77,16,'#ffd166');text('두 사람이 만났어요 ♥',91,96,8,'#fff8e8');text('축하합니다!',116,111,8,'#a7f3d0')}if(flash>0){x.fillStyle='rgba(255,255,255,.55)';x.fillRect(0,0,W,H)}requestAnimationFrame(loop)}
function set(k,v){keys[k]=v}addEventListener('keydown',e=>{if(e.key==='ArrowLeft')set('left',1);if(e.key==='ArrowRight')set('right',1);if(e.key==='ArrowUp'||e.key===' ')set('jump',1);if(e.key==='Shift')set('boost',1)});addEventListener('keyup',e=>{if(e.key==='ArrowLeft')set('left',0);if(e.key==='ArrowRight')set('right',0);if(e.key==='ArrowUp'||e.key===' ')set('jump',0);if(e.key==='Shift')set('boost',0)});document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();set(k,1)});['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>set(k,0)))});again.addEventListener('click',reset);reset();loop();
})();
</script></body></html>
