<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🍄 DD 의 결혼식 | Super Wedding Bros</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
*{margin:0;padding:0;box-sizing:border-box;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
body{font-family:'Press Start 2P',cursive;background:#5c94fc;overflow:hidden;width:100vw;height:100vh}
#game{display:block;margin:0 auto;background:linear-gradient(#5c94fc 0%,#5c94fc 60%,#e89c30 60%,#e89c30 100%)}
.ui{position:absolute;top:10px;left:10px;color:#fff;text-shadow:2px 2px #000;font-size:12px;z-index:10}
#startScreen{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;color:#fff;text-shadow:3px 3px #000;z-index:20;width:90%}
#startScreen h1{font-size:16px;margin-bottom:20px;color:#ff6b6b;line-height:1.5}
#startScreen p{font-size:10px;margin:10px 0;animation:blink 0.7s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.controls{position:absolute;bottom:20px;left:0;right:0;display:flex;justify-content:space-between;padding:0 30px;z-index:10}
.btn-group{display:flex;gap:15px}
.ctrl-btn{width:65px;height:65px;background:rgba(255,255,255,0.4);border:3px solid #fff;border-radius:50%;color:#fff;font-size:28px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.ctrl-btn:active{background:rgba(255,255,255,0.7);transform:scale(0.95)}
.ctrl-btn.jump{width:75px;height:75px}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="ui"><div>💒 WEDDING QUEST</div><div style="margin-top:8px">📅 2026.11.23</div></div>
<div id="startScreen">
<h1>🍄 SUPER WEDDING BROS 🍄</h1>
<p>▶ TAP TO START ◀</p>
<p style="font-size:8px;margin-top:20px;color:#ffd700">Reach the wedding hall! 💒</p>
</div>
<div class="controls">
<div class="btn-group">
<div class="ctrl-btn" id="btnLeft">◀</div>
<div class="ctrl-btn" id="btnRight">▶</div>
</div>
<div class="btn-group">
<div class="ctrl-btn jump" id="btnJump">▲</div>
</div>
</div>

<script>
(function(){
var canvas=document.getElementById('game');
var ctx=canvas.getContext('2d');
var startScreen=document.getElementById('startScreen');

function resize(){
canvas.width=Math.min(window.innerWidth,800);
canvas.height=Math.min(window.innerHeight-160,450);
}
resize();
window.addEventListener('resize',resize);

var gameRunning=false;
var player={x:50,y:0,width:32,height:40,vx:0,vy:0,grounded:false};
var platforms=[];
var coins=[];
var goal={x:0,y:0,width:40,height:40};
var keys={left:false,right:false,up:false};

function initLevel(){
platforms=[
{x:0,y:canvas.height-50,width:canvas.width,height:50},
{x:canvas.width*0.2,y:canvas.height-130,width:120,height:20},
{x:canvas.width*0.45,y:canvas.height-190,width:100,height:20},
{x:canvas.width*0.7,y:canvas.height-140,width:100,height:20}
];
coins=[
{x:canvas.width*0.25,y:canvas.height-160,collected:false},
{x:canvas.width*0.5,y:canvas.height-220,collected:false},
{x:canvas.width*0.75,y:canvas.height-170,collected:false}
];
goal={x:canvas.width-70,y:canvas.height-230,width:40,height:40};
}

function startGame(){
if(gameRunning)return;
gameRunning=true;
startScreen.style.display='none';
player={x:50,y:canvas.height-100,width:32,height:40,vx:0,vy:0,grounded:false};
initLevel();
loop();
}

canvas.addEventListener('click',startGame);
canvas.addEventListener('touchstart',function(e){e.preventDefault();startGame();},{passive:false});

function setupBtn(id,key){
var btn=document.getElementById(id);
btn.addEventListener('touchstart',function(e){e.preventDefault();keys[key]=true;},{passive:false});
btn.addEventListener('touchend',function(e){e.preventDefault();keys[key]=false;},{passive:false});
btn.addEventListener('mousedown',function(){keys[key]=true;});
btn.addEventListener('mouseup',function(){keys[key]=false;});
btn.addEventListener('mouseleave',function(){keys[key]=false;});
}
setupBtn('btnLeft','left');
setupBtn('btnRight','right');
setupBtn('btnJump','up');

document.addEventListener('keydown',function(e){
if(e.code==='ArrowLeft'||e.code==='KeyA')keys.left=true;
if(e.code==='ArrowRight'||e.code==='KeyD')keys.right=true;
if(e.code==='ArrowUp'||e.code==='KeyW'||e.code==='Space')keys.up=true;
});
document.addEventListener('keyup',function(e){
if(e.code==='ArrowLeft'||e.code==='KeyA')keys.left=false;
if(e.code==='ArrowRight'||e.code==='KeyD')keys.right=false;
if(e.code==='ArrowUp'||e.code==='KeyW'||e.code==='Space')keys.up=false;
});

function update(){
if(keys.right)player.vx=4;
else if(keys.left)player.vx=-4;
else player.vx=0;

if(keys.up&&player.grounded){
player.vy=-11;
player.grounded=false;
}

player.vy+=0.6;
player.x+=player.vx;
player.y+=player.vy;

player.grounded=false;
for(var i=0;i<platforms.length;i++){
var p=platforms[i];
if(player.x<p.x+p.width&&player.x+player.width>p.x&&
player.y+player.height>p.y&&player.y+player.height<p.y+p.height+15&&player.vy>=0){
player.grounded=true;
player.vy=0;
player.y=p.y-player.height;
}
}

if(player.y>canvas.height){player.x=50;player.y=canvas.height-100;player.vy=0;}
if(player.x<0)player.x=0;
if(player.x>canvas.width-player.width)player.x=canvas.width-player.width;

for(var j=0;j<coins.length;j++){
if(!coins[j].collected&&Math.abs(player.x-coins[j].x)<35&&Math.abs(player.y-coins[j].y)<35){
coins[j].collected=true;
}
}

if(Math.abs(player.x-goal.x)<35&&Math.abs(player.y-goal.y)<35){
setTimeout(function(){
alert('🎉 WEDDING COMPLETE! 🎉\n\n📅 Date: 2026.11.23\n⏰ Time: 14:00 KST\n📍 Place: Grand Ballroom 3F\n\nThank you for playing!');
},50);
gameRunning=false;
startScreen.style.display='block';
}
}

function draw(){
ctx.clearRect(0,0,canvas.width,canvas.height);

for(var i=0;i<platforms.length;i++){
var p=platforms[i];
ctx.fillStyle='#c84c0c';
ctx.fillRect(p.x,p.y,p.width,p.height);
ctx.fillStyle='#f8b800';
ctx.fillRect(p.x,p.y,p.width,6);
}

for(var j=0;j<coins.length;j++){
if(!coins[j].collected){
ctx.fillStyle='#ffd700';
ctx.beginPath();
ctx.arc(coins[j].x,coins[j].y,12,0,Math.PI*2);
ctx.fill();
}
}

ctx.fillStyle='#ff6b6b';
ctx.fillRect(goal.x,goal.y,goal.width,goal.height);
ctx.fillStyle='#fff';
ctx.font='16px "Press Start 2P"';
ctx.fillText('💒',goal.x+4,goal.y+28);

ctx.fillStyle='#e74c3c';
ctx.fillRect(player.x,player.y,player.width,player.height);
ctx.fillStyle='#fff';
ctx.font='24px "Press Start 2P"';
ctx.fillText('🤵',player.x+2,player.y+32);
}

function loop(){
if(!gameRunning)return;
update();
draw();
requestAnimationFrame(loop);
}

initLevel();
player={x:50,y:canvas.height-100,width:32,height:40};
draw();
})();
</script>
</body>
</html>
