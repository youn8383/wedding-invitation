<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍄 DD 의 결혼식 | Super Wedding Bros</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Press Start 2P', cursive; background: #5c94fc; overflow: hidden; }
        #game { display: block; margin: 0 auto; background: linear-gradient(#5c94fc 0%, #5c94fc 60%, #e89c30 60%, #e89c30 100%); }
        .ui { position: absolute; top: 10px; left: 10px; color: #fff; text-shadow: 2px 2px #000; font-size: 12px; }
        .controls { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); color: #fff; text-align: center; font-size: 10px; text-shadow: 1px 1px #000; }
        #startScreen { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; color: #fff; text-shadow: 3px 3px #000; }
        #startScreen h1 { font-size: 24px; margin-bottom: 20px; color: #ff6b6b; }
        #startScreen p { font-size: 10px; margin: 10px 0; animation: blink 0.5s infinite; }
        @keyframes blink { 0%, 50%, 100% { opacity: 1; } 25%, 75% { opacity: 0; } }
    </style>
</head>
<body>
    <canvas id="game" width="800" height="400"></canvas>
    <div class="ui"><div>💒 WEDDING QUEST</div><div style="margin-top:5px;">📅 2026.11.23</div></div>
    <div class="controls">⬅️➡️ 이동 | ⬆️ 점프 | SPACE 시작/재시작</div>
    <div id="startScreen"><h1>🍄 SUPER WEDDING BROS 🍄</h1><p>PRESS SPACE TO START</p><p style="font-size:8px;margin-top:20px;">Reach the wedding hall!</p></div>
    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const startScreen = document.getElementById('startScreen');
        let gameRunning = false;
        let player = { x: 50, y: 300, width: 30, height: 40, vx: 0, vy: 0, grounded: false };
        let platforms = [
            { x: 0, y: 350, width: 800, height: 50 },
            { x: 200, y: 280, width: 100, height: 20 },
            { x: 350, y: 220, width: 100, height: 20 },
            { x: 500, y: 280, width: 100, height: 20 },
            { x: 650, y: 200, width: 80, height: 20 }
        ];
        let coins = [
            { x: 230, y: 250, collected: false },
            { x: 380, y: 190, collected: false },
            { x: 530, y: 250, collected: false },
            { x: 680, y: 170, collected: false }
        ];
        let goal = { x: 720, y: 160, width: 40, height: 40 };
        let keys = {};
        document.addEventListener('keydown', e => {
            keys[e.code] = true;
            if (e.code === 'Space' && !gameRunning) startGame();
        });
        document.addEventListener('keyup', e => keys[e.code] = false);
        function startGame() {
            gameRunning = true;
            startScreen.style.display = 'none';
            player = { x: 50, y: 300, width: 30, height: 40, vx: 0, vy: 0, grounded: false };
            coins.forEach(c => c.collected = false);
            gameLoop();
        }
        function update() {
            if (keys['ArrowRight']) player.vx = 3;
            else if (keys['ArrowLeft']) player.vx = -3;
            else player.vx = 0;
            if (keys['ArrowUp'] && player.grounded) {
                player.vy = -10;
                player.grounded = false;
            }
            player.vy += 0.5;
            player.x += player.vx;
            player.y += player.vy;
            player.grounded = false;
            platforms.forEach(p => {
                if (player.x < p.x + p.width && player.x + player.width > p.x &&
                    player.y + player.height > p.y && player.y + player.height < p.y + p.height + 10 &&
                    player.vy >= 0) {
                    player.grounded = true;
                    player.vy = 0;
                    player.y = p.y - player.height;
                }
            });
            if (player.y > 400) { player.x = 50; player.y = 300; player.vy = 0; }
            if (player.x < 0) player.x = 0;
            if (player.x > 770) player.x = 770;
            coins.forEach(c => {
                if (!c.collected && Math.abs(player.x - c.x) < 30 && Math.abs(player.y - c.y) < 30) {
                    c.collected = true;
                }
            });
            if (Math.abs(player.x - goal.x) < 30 && Math.abs(player.y - goal.y) < 30) {
                alert('🎉 WEDDING COMPLETE! 🎉\n\nDate: 2026.11.23\nTime: 14:00 KST\nPlace: Grand Ballroom 3F\n\nThank you for playing!');
                gameRunning = false;
                startScreen.style.display = 'block';
            }
        }
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            platforms.forEach(p => {
                ctx.fillStyle = '#c84c0c';
                ctx.fillRect(p.x, p.y, p.width, p.height);
                ctx.fillStyle = '#f8b800';
                ctx.fillRect(p.x, p.y, p.width, 5);
            });
            coins.forEach(c => {
                if (!c.collected) {
                    ctx.fillStyle = '#ffd700';
                    ctx.beginPath();
                    ctx.arc(c.x, c.y, 10, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
            ctx.fillStyle = '#ff6b6b';
            ctx.fillRect(goal.x, goal.y, goal.width, goal.height);
            ctx.fillStyle = '#fff';
            ctx.font = '10px "Press Start 2P"';
            ctx.fillText('💒', goal.x + 5, goal.y + 25);
            ctx.fillStyle = '#ff6b6b';
            ctx.fillRect(player.x, player.y, player.width, player.height);
            ctx.fillStyle = '#fff';
            ctx.font = '20px "Press Start 2P"';
            ctx.fillText('🤵', player.x, player.y + 30);
        }
        function gameLoop() {
            if (!gameRunning) return;
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
        draw();
    </script>
</body>
</html>
