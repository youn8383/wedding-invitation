<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>윤상현 ♥ 신아람 결혼합니다</title>
    <meta name="description" content="2026년 12월 20일 (일) 오후 1시, 더화이트베일 3층 V홀">
    <meta name="theme-color" content="#050506">
    <meta property="og:type" content="website">
    <meta property="og:title" content="윤상현 ♥ 신아람 결혼합니다">
    <meta property="og:description" content="2026.12.20 (일) 오후 1시 · 더화이트베일 3층 V홀">
    <meta property="og:image" content="https://wedding-invitation-new-delta.vercel.app/images/og-split.jpg?v=1">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="터미널 버전과 레트로 게임 버전 청첩장 · 윤상현 ♥ 신아람 · 2026.12.20 SUN 13:00">
    <meta name="twitter:card" content="summary_large_image">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <!-- 다음 페이지 리소스를 미리 받아 전환을 빠르게 -->
    <link rel="prefetch" href="/terminal.html">
    <link rel="prefetch" href="/retro-game.html">

    <style>
        :root { --bg: #050506; --text: #e8e8ea; --muted: #6f6f78; --green: #4ade80; --gold: #ffcf5c; --rose: #ff6f91; --mint: #6ee7c8; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body { display: grid; place-items: center; background: var(--bg); color: var(--text); font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; overflow: hidden; }
        .boot { width: min(360px, calc(100vw - 40px)); font-size: 13px; line-height: 2; }
        .boot .line { white-space: pre; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
        .boot .line b { font-weight: 400; color: var(--text); }
        .boot .ok { color: var(--green); }
        .boot .pick { margin-top: 10px; font-size: 18px; font-weight: 700; letter-spacing: .04em; }
        .boot .pick.terminal { color: var(--green); text-shadow: 0 0 14px rgba(74, 222, 128, .5); }
        .boot .pick.retro { color: var(--gold); text-shadow: 2px 2px 0 var(--rose); }
        .bar { margin-top: 14px; height: 2px; background: #1a1a1f; overflow: hidden; }
        .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--green), var(--mint), var(--gold), var(--rose)); transition: width 1.3s cubic-bezier(.4, 0, .2, 1); }
        .cursor { display: inline-block; width: 8px; height: 1em; vertical-align: -2px; background: var(--green); animation: blink 1s steps(1) infinite; }
        @keyframes blink { 50% { opacity: 0; } }

        /* glitch-out right before switching pages */
        .glitch { position: fixed; inset: 0; pointer-events: none; opacity: 0; }
        .glitch.go { animation: glitch .32s steps(4) forwards; }
        .glitch::before, .glitch::after { content: ''; position: absolute; left: 0; right: 0; height: 18%; }
        .glitch::before { top: 22%; background: rgba(0, 255, 255, .55); mix-blend-mode: screen; }
        .glitch::after { top: 61%; background: rgba(255, 0, 160, .55); mix-blend-mode: screen; }
        @keyframes glitch {
            0% { opacity: 1; transform: translateX(-8px); }
            25% { opacity: 1; transform: translateX(10px) skewX(-6deg); }
            50% { opacity: 1; transform: translateX(-4px); background: rgba(255, 255, 255, .08); }
            100% { opacity: 1; background: var(--bg); }
        }
        .boot.shake { animation: shake .3s steps(3); }
        @keyframes shake { 33% { transform: translate(3px, -1px); filter: hue-rotate(90deg); } 66% { transform: translate(-3px, 1px); } }

        noscript { display: block; text-align: center; line-height: 2.2; }
        noscript a { color: var(--green); }
    </style>
</head>
<body>
    <main class="boot" id="boot" aria-live="polite">
        <noscript>
            윤상현 ♥ 신아람 결혼합니다<br>
            <a href="/terminal.html">터미널 버전</a> · <a href="/retro-game.html">레트로 게임 버전</a>
        </noscript>
    </main>
    <div class="glitch" id="glitch" aria-hidden="true"></div>

    <script>
    // 대표 주소(/): 공유 썸네일은 터미널·레트로 반반, 열 때마다 둘 중 하나로 랜덤 진입
    //  - 테스트: ?theme=terminal|retro 로 고정, ?phase=… 등 다른 파라미터는 그대로 넘김
    (function boot() {
        const PAGES = { terminal: '/terminal.html', retro: '/retro-game.html' };
        const params = new URLSearchParams(location.search);
        const forced = params.get('theme');
        params.delete('theme');
        const theme = PAGES[forced] ? forced : (crypto.getRandomValues(new Uint8Array(1))[0] % 2 ? 'retro' : 'terminal');
        const qs = params.toString();
        const target = PAGES[theme] + (qs ? '?' + qs : '') + location.hash;
        const go = () => location.replace(target);

        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return go();

        const box = document.getElementById('boot');
        const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
        const line = (html, cls = 'line') => { const el = document.createElement('div'); el.className = cls; el.innerHTML = html; box.appendChild(el); return el; };
        const label = theme === 'retro' ? '▶ RETRO GAME' : '$ TERMINAL';

        (async () => {
            const bar = document.createElement('div'); bar.className = 'bar'; bar.innerHTML = '<i></i>';
            line('<b>wedding.os</b> v1.0 — 윤상현 ♥ 신아람');
            box.appendChild(bar);
            requestAnimationFrame(() => { bar.firstChild.style.width = '100%'; });
            await sleep(260);
            line('&gt; mounting 2026-12-20 ......... <span class="ok">ok</span>');
            await sleep(260);
            {
                const roll = line('&gt; rolling theme dice ');
                for (let i = 0; i < 8; i++) { roll.innerHTML = '&gt; rolling theme dice ' + '|/-\\'[i % 4]; await sleep(60); }
                roll.innerHTML = '&gt; rolling theme dice ........ <span class="ok">ok</span>';
            }
            await sleep(160);
            line(label + ' <span class="cursor"></span>', 'pick ' + theme);
            await sleep(520);
            box.classList.add('shake');
            document.getElementById('glitch').classList.add('go');
            await sleep(300);
            go();
        })();
    })();
    </script>
</body>
</html>
