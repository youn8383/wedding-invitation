<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>윤상현 ♥ 신아람 결혼합니다</title>
    <meta name="description" content="2026년 12월 20일 (일) 오후 1시, 더화이트베일 3층 V홀">
    <link rel="icon" href="/images/icon-main.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/images/apple-touch-main.png">
    <meta name="theme-color" content="#fbf1ec">
    <meta property="og:type" content="website">
    <meta property="og:title" content="윤상현 ♥ 신아람 결혼합니다">
    <meta property="og:description" content="2026.12.20 (일) 오후 1시 · 더화이트베일 3층 V홀">
    <meta property="og:image" content="https://wedding-invitation-new-delta.vercel.app/images/og-main.jpg?v=4">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="We're getting married · 윤상현 &amp; 신아람 · 2026. 12. 20. SUN 1:00 PM · 더화이트베일 3층 V홀">
    <meta name="twitter:card" content="summary_large_image">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- same type as the share card: Cormorant (italic script) + Gowun Batang (Korean serif) -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
    <link rel="prefetch" href="/terminal.html">
    <link rel="prefetch" href="/retro-game.html">

    <style>
        :root { --ink: #42342f; --soft: #806860; --gold: #b88e5c; --rose: #eca0a8; --dark: #050506; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body { display: grid; place-items: center; overflow: hidden; color: var(--ink); font-family: 'Gowun Batang', serif;
            background: radial-gradient(70% 55% at 30% 18%, rgba(255,255,255,.7), transparent 70%), linear-gradient(180deg, #fdf6f0 0%, #f6dad2 100%); }

        .card { position: relative; text-align: center; padding: 0 24px; }
        .orn { margin-bottom: 14px; font-size: 14px; color: var(--gold); letter-spacing: .5em; }
        .script { font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 500; font-size: 26px; color: var(--gold); }
        .names { margin-top: 12px; font-size: 38px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.35; }
        .names .amp { display: block; font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 500; font-size: 30px; color: var(--gold); line-height: 1.1; }
        .rule { width: 56px; height: 1px; margin: 18px auto 14px; background: var(--gold); opacity: .7; }
        .date { font-size: 15px; color: var(--soft); letter-spacing: .02em; }

        .invite { margin-top: 34px; font-size: 17px; color: var(--gold); letter-spacing: .04em; opacity: 0; }
        /* soft entrance, one element after another */
        .in { opacity: 0; transform: translateY(8px); animation: rise .9s cubic-bezier(.2, .7, .2, 1) forwards; }
        @keyframes rise { to { opacity: 1; transform: none; } }
        .petal { position: fixed; top: -20px; width: 10px; height: 7px; border-radius: 50%; background: rgba(236, 160, 168, .75); pointer-events: none; animation: fall linear infinite; }
        @keyframes fall { to { transform: translate(var(--dx), 110vh) rotate(540deg); } }

        /* fade into the dark of the invitation pages (they unveil from #050506) */
        .dusk { position: fixed; inset: 0; z-index: 10; background: var(--dark); opacity: 0; pointer-events: none; transition: opacity .7s cubic-bezier(.4, 0, .2, 1); }
        .dusk.go { opacity: 1; }

        noscript { display: block; text-align: center; line-height: 2.2; }
        noscript a { color: var(--gold); }
        @media (prefers-reduced-motion: reduce) { .in { animation: none; opacity: 1; transform: none; } .petal { display: none; } }
    </style>
</head>
<body>
    <main class="card" aria-live="polite">
        <div class="orn in" style="animation-delay:.05s" aria-hidden="true">✦</div>
        <p class="script in" style="animation-delay:.15s">We're getting married</p>
        <h1 class="names in" style="animation-delay:.35s">윤상현<span class="amp">&amp;</span>신아람</h1>
        <div class="rule in" style="animation-delay:.55s"></div>
        <p class="date in" style="animation-delay:.65s">2026. 12. 20. 일요일 오후 1시 · 더화이트베일</p>
        <p class="invite" id="invite">두 사람의 이야기 속으로 초대합니다</p>
        <noscript><a href="/terminal.html">터미널 버전</a> · <a href="/retro-game.html">레트로 게임 버전</a></noscript>
    </main>
    <div class="dusk" id="dusk" aria-hidden="true"></div>

    <script>
    // 대표 주소(/): 클래식 인트로 → 열 때마다 터미널/레트로 중 랜덤 진입
    //  - 테스트: ?theme=terminal|retro 로 고정, ?phase=… 등 다른 파라미터는 그대로 넘김
    (function boot() {
        const PAGES = { terminal: '/terminal.html', retro: '/retro-game.html' };
        const params = new URLSearchParams(location.search);
        const forced = params.get('theme');
        params.delete('theme');
        const theme = PAGES[forced] ? forced : (crypto.getRandomValues(new Uint8Array(1))[0] % 2 ? 'retro' : 'terminal');
        const qs = params.toString();
        const target = PAGES[theme] + (qs ? '?' + qs : '') + location.hash;
        const go = () => { try { sessionStorage.setItem('wedding-boot', '1'); } catch {} location.replace(target); };

        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return go();

        for (let i = 0; i < 30; i++) {                      // drifting petals
            const p = document.createElement('i');
            p.className = 'petal';
            p.style.left = Math.random() * 100 + 'vw';
            p.style.setProperty('--dx', (Math.random() * 80 - 40) + 'px');
            p.style.animationDuration = 5 + Math.random() * 5 + 's';
            p.style.animationDelay = -Math.random() * 8 + 's';
            document.body.appendChild(p);
        }

        const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
        (async () => {
            await sleep(1300);
            document.getElementById('invite').classList.add('in');
            await sleep(1200);
            document.getElementById('dusk').classList.add('go');
            await sleep(700);
            go();
        })();
    })();
    </script>
</body>
</html>
